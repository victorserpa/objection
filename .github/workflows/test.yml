# Runs the pull request's code: tests only. The checks that decide whether
# a PR may merge (commit rules, issue link, objection record) live in
# governance.yml and run from main, so a PR cannot edit them to pass.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  os:
    # Windows runs the same bash scripts through Git Bash, which is what
    # Claude Code itself requires there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Every suite runs even when one fails, so one run shows them all.
      - run: |
          rc=0
          for t in gate check-pr roles-in-sync precedents brief review debate ci-review init pr-body open-issue eval doctor newer-copy; do
            echo "::group::$t"
            bash "test/$t.test.sh" || rc=1
            echo "::endgroup::"
          done
          exit $rc
  # The ruleset requires a check named "test": one job that passes only
  # when every system passed.
  test:
    needs: os
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.os.result }}" = success ]'
